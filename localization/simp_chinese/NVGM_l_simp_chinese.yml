 NVGM_MONEY_CREDIT:0 "#tooltip_header [concept_money]#!\n#white $BALANCE$：#!@money!#bold [Country.PredictWeeklyBalance|1=+D]#!\n[concept_gold_reserves]: #tooltippable #tooltip:GOLD_RESERVES_BREAKDOWN @money![Country.GetGoldReserves|Dv]#!#!\n[concept_credit]: #tooltippable #tooltip:CREDIT_PROGRESS #variable @money![Country.GetPrincipal|K]#!#!#! / #maximum [Country.GetMaxCredit|K]#!\n$TOOLTIP_DELIMITER$\n#header $NATIONAL_REVENUE$ ：#!#variable @money![Country.PredictWeeklyIncome|D+=]#!\n　@money![Country.GetIncomeTaxIncome|D+=] $BUDGET_INCOME_TAXES$\n　@money![Country.GetPollTaxIncome|D+=] $BUDGET_POLL_TAXES$\n　@money![Country.PredictConsumptionTaxes|D+=] $BUDGET_CONSUMPTION_TAXES$\n　@money![Country.PredictDividendsTaxes|D+=] $BUDGET_DIVIDENDS_TAXES$\n　@money![Country.PredictTariffs|D+=] $BUDGET_TARIFFS$\n　@money![Country.PredictMinting|D+=] $BUDGET_MINTING$\n　@money![Country.PredictGovernmentShareDividends|D+=] $DIVIDENDS_FROM_GOVERNMENT_SHARES$\n　@money![Country.GetModifier.GetValueFor('country_tax_income_add')|D+=] $BUDGET_ADDITIONAL_INCOME$\n\n#bold #white Temporary National Revenue ：#!#bold #P @money!+[Country.GetWeeklyTemporaryIncome|D+]#!#!\n　@money![Country.GetWeeklyTemporaryIncome|D+=] [concept_budget_investment_income]\n\n#header $NATIONAL_EXPENSES$ ：#!#variable #bold #N @money!-[Country.GetWeeklyExpenses|D-]#!#!\n　#N @money!-[Country.PredictGovernmentWagesExpenses|D-]#! $BUDGET_GOVERNMENT_WAGES$\n　#N @money!-[Country.GetGovernmentGoodsExpenses|D-]#! $BUDGET_GOODS_FOR_GOVERNMENT_BUILDINGS$\n　#N @money!-[Country.PredictMilitaryWagesExpenses|D-]#! $BUDGET_MILITARY_WAGES$\n　#N @money!-[Country.GetMilitaryGoodsExpenses|D-]#! $BUDGET_GOODS_FOR_MILITARY_BUILDINGS$\n　#N @money!-[Country.GetWelfarePaymentsExpenses|D-]#! $BUDGET_WELFARE_PAYMENTS$\n　#N @money!-[Country.GetSubsidiesExpenses|D-]#! $BUDGET_SUBSIDIES$\n　#N @money!-[Country.PredictGovernmentShareLosses|D-]#! $LOSSES_FROM_GOVERNMENT_SHARES$\n\n#bold Temporary National Expenses ：#!#bold #N @money!-[Country.Get